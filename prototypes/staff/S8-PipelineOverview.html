<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Staff - Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden sm:rounded-[40px] flex flex-col shadow-2xl ring-1 ring-border pb-[80px]">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-4 border-b border-border bg-surface shrink-0 pt-2 z-10">
            <div class="w-10"></div>
            <h1 class="text-bodyLarge font-bold">My Pipeline</h1>
            <button class="w-10 h-10 flex items-center justify-center text-textPrimary">
                <i data-lucide="filter" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Tabs -->
        <div class="flex bg-surface border-b border-border px-4 pt-2">
            <button class="flex-1 pb-3 text-bodyBold text-primary border-b-2 border-primary">Active FI (5)</button>
            <button class="flex-1 pb-3 text-body font-medium text-textSecondary">Approved (18)</button>
            <button class="flex-1 pb-3 text-body font-medium text-textSecondary">Rejected (3)</button>
        </div>

        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-4 no-scrollbar space-y-4">
            
            <!-- File Card: FI Pending -->
            <div class="bg-surface border border-border rounded-xl shadow-sm p-4 cursor-pointer hover:border-primary transition-colors">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h3 class="text-bodyBold font-bold">Suresh Patel</h3>
                        <p class="text-caption text-textSecondary font-mono mt-0.5">#APP-84915</p>
                    </div>
                    <span class="bg-blue-50 text-primary text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wide">FI Pending</span>
                </div>
                <div class="flex justify-between items-end mt-4 border-t border-border pt-3">
                    <div>
                        <p class="text-caption text-textSecondary">ITI Finance • Commercial</p>
                        <p class="text-body font-bold mt-0.5">₹8,00,000</p>
                    </div>
                    <div class="text-right">
                        <p class="text-caption text-textSecondary font-medium">Dealer</p>
                        <p class="text-caption font-bold">Wheels Auto</p>
                    </div>
                </div>
            </div>

            <!-- File Card: FI Complete, Pending Approval -->
            <div class="bg-surface border border-border rounded-xl shadow-sm p-4 cursor-pointer hover:border-primary transition-colors">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h3 class="text-bodyBold font-bold">Ramesh Kumar</h3>
                        <p class="text-caption text-textSecondary font-mono mt-0.5">#APP-84920</p>
                    </div>
                    <span class="bg-orange-50 text-warning text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wide">Under Review</span>
                </div>
                <div class="flex justify-between items-end mt-4 border-t border-border pt-3">
                    <div>
                        <p class="text-caption text-textSecondary">SK Finance • Used Car</p>
                        <p class="text-body font-bold mt-0.5">₹4,50,000</p>
                    </div>
                    <div class="text-right">
                        <p class="text-caption text-textSecondary font-medium">FI Status</p>
                        <p class="text-caption font-bold text-success"><i data-lucide="check" class="w-3 h-3 inline"></i> Submitted</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full h-[80px] bg-surface border-t border-border flex justify-around items-center px-2 z-20 pb-4">
            <a href="./S3-Dashboard.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="./S4-TaskQueue.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="clipboard-list" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Tasks</span>
            </a>
            <a href="./S8-PipelineOverview.html" class="flex flex-col items-center gap-1 p-2 text-primary">
                <i data-lucide="files" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Pipeline</span>
            </a>
            <a href="./S10-Profile.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </nav>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
