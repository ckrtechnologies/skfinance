<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Staff - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden sm:rounded-[40px] flex flex-col shadow-2xl ring-1 ring-border pb-[80px]">
        
        <!-- Header / Cover -->
        <header class="bg-primary text-white pt-16 pb-8 px-6 rounded-b-[32px] shadow-md relative z-10 flex flex-col items-center text-center">
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-primary text-h1 font-bold mb-3 shadow-lg border-4 border-white/20">
                A
            </div>
            <h2 class="text-h1 font-bold">Amit Kumar</h2>
            <p class="text-blue-100 text-body mt-1">Field Executive • EMP-104</p>
            
            <div class="mt-5 grid grid-cols-2 gap-4 w-full px-4">
                <div class="bg-white/10 rounded-xl p-3 border border-white/20">
                    <p class="text-caption text-blue-100 uppercase tracking-wide">Target</p>
                    <p class="text-bodyLarge font-bold mt-1">20 / Month</p>
                </div>
                <div class="bg-white/10 rounded-xl p-3 border border-white/20">
                    <p class="text-caption text-blue-100 uppercase tracking-wide">Achieved</p>
                    <p class="text-bodyLarge font-bold mt-1 text-success">15</p>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-4 no-scrollbar">
            
            <div class="bg-surface border border-border rounded-xl shadow-sm overflow-hidden mb-6">
                <div class="p-4 flex items-center gap-4 border-b border-border hover:bg-surfaceAlt transition-colors cursor-pointer">
                    <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary shrink-0">
                        <i data-lucide="award" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-bodyBold font-bold">Incentives & Pay</h4>
                        <p class="text-caption text-textSecondary">View monthly performance</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-textSecondary"></i>
                </div>
                
                <div class="p-4 flex items-center gap-4 border-b border-border hover:bg-surfaceAlt transition-colors cursor-pointer">
                    <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary shrink-0">
                        <i data-lucide="calendar" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-bodyBold font-bold">Attendance</h4>
                        <p class="text-caption text-textSecondary">Punch In / Out History</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-textSecondary"></i>
                </div>

                <div class="p-4 flex items-center gap-4 hover:bg-surfaceAlt transition-colors cursor-pointer">
                    <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary shrink-0">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-bodyBold font-bold">App Settings</h4>
                        <p class="text-caption text-textSecondary">Location & Preferences</p>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-textSecondary"></i>
                </div>
            </div>

            <div class="bg-surface border border-border rounded-xl shadow-sm overflow-hidden">
                
                <a href="./S2-Login.html" class="p-4 flex items-center gap-4 hover:bg-red-50 transition-colors cursor-pointer text-danger group">
                    <div class="w-10 h-10 bg-red-50 group-hover:bg-red-100 rounded-full flex items-center justify-center shrink-0">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-bodyBold font-bold">Log Out</h4>
                    </div>
                </a>
            </div>
            
            <p class="text-center text-caption text-textSecondary mt-6">Staff App Version 3.0.1</p>

        </div>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full h-[80px] bg-surface border-t border-border flex justify-around items-center px-2 z-20 pb-4">
            <a href="./S3-Dashboard.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="./S4-TaskQueue.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="clipboard-list" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Tasks</span>
            </a>
            <a href="./S8-PipelineOverview.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="files" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Pipeline</span>
            </a>
            <a href="./S10-Profile.html" class="flex flex-col items-center gap-1 p-2 text-primary">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Profile</span>
            </a>
        </nav>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
