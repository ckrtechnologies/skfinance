<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Customer - Quick Eligibility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-surface text-textPrimary relative overflow-hidden sm:rounded-[40px] flex flex-col shadow-2xl ring-1 ring-border">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-4 border-b border-border bg-surface shrink-0 pt-2">
            <a href="./C4-Home.html" class="w-10 h-10 flex items-center justify-center text-textPrimary">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <h1 class="text-bodyLarge font-bold">Eligibility Check</h1>
            <div class="w-10"></div> <!-- Spacer -->
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-background h-1">
            <div class="bg-primary h-1 w-1/3 rounded-r"></div>
        </div>

        <!-- Form Content -->
        <div class="flex-1 overflow-y-auto p-6 pb-32 no-scrollbar">
            
            <h2 class="text-h2 font-bold mb-2">Let's check your eligibility</h2>
            <p class="text-body text-textSecondary mb-8">This soft check won't affect your credit score.</p>
            
            <form id="eligibilityForm">
                
                <!-- Product Selected -->
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-3">Selected Product</label>
                    <div class="bg-blue-50 border border-primary/30 rounded-xl p-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-primary shadow-sm">
                            <i data-lucide="car" class="w-5 h-5"></i>
                        </div>
                        <span class="font-bold text-primary text-bodyLarge">Used Car Loan</span>
                    </div>
                </div>

                <!-- Loan Amount -->
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-3">Required Loan Amount</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-h2 font-bold text-textSecondary">₹</span>
                        <input type="number" class="w-full bg-background border border-border rounded-xl pl-10 pr-4 py-4 text-h2 font-bold focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="5,00,000" value="450000">
                    </div>
                </div>

                <!-- Age -->
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-3">Your Age</label>
                    <input type="number" class="w-full bg-background border border-border rounded-xl px-4 py-4 text-bodyLarge font-medium focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="e.g. 34" value="34">
                </div>

                <!-- Income Type -->
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-3">Income Type</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="incomeType" class="peer sr-only" checked>
                            <div class="w-full text-center p-3 rounded-xl border border-border bg-background peer-checked:border-primary peer-checked:bg-blue-50 peer-checked:text-primary font-medium text-body transition-colors">
                                Salaried
                            </div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="incomeType" class="peer sr-only">
                            <div class="w-full text-center p-3 rounded-xl border border-border bg-background peer-checked:border-primary peer-checked:bg-blue-50 peer-checked:text-primary font-medium text-body transition-colors">
                                Self-Employed
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Monthly Income -->
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-3">Monthly Income</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-bodyLarge font-medium text-textSecondary">₹</span>
                        <input type="number" class="w-full bg-background border border-border rounded-xl pl-10 pr-4 py-4 text-bodyLarge font-medium focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="40,000" value="45000">
                    </div>
                </div>

                <!-- Residence Type -->
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-3">Residence Type</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="residence" class="peer sr-only" checked>
                            <div class="w-full text-center p-3 rounded-xl border border-border bg-background peer-checked:border-primary peer-checked:bg-blue-50 peer-checked:text-primary font-medium text-body transition-colors">
                                Owned (Self)
                            </div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="residence" class="peer sr-only">
                            <div class="w-full text-center p-3 rounded-xl border border-border bg-background peer-checked:border-primary peer-checked:bg-blue-50 peer-checked:text-primary font-medium text-body transition-colors">
                                Rented
                            </div>
                        </label>
                    </div>
                </div>
                
                <!-- CIBIL Band (Proxy for pre-check) -->
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-3">Estimated CIBIL Score</label>
                    <select class="w-full bg-background border border-border rounded-xl px-4 py-4 text-bodyLarge font-medium focus:outline-none focus:border-primary appearance-none">
                        <option value="">Select Range</option>
                        <option value="high" selected>750+</option>
                        <option value="med">700 - 749</option>
                        <option value="low">Below 700</option>
                        <option value="unknown">I don't know</option>
                    </select>
                </div>
            </form>
        </div>

        <!-- Sticky Footer -->
        <div class="absolute bottom-0 w-full bg-surface border-t border-border p-6 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20 pb-10">
            <a href="./C6-EligibilityResult.html" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl transition-colors text-center block text-bodyLarge shadow-lg shadow-primary/30">
                Check Offers
            </a>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
