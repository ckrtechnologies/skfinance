<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Customer - Loan Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden sm:rounded-[40px] flex flex-col shadow-2xl ring-1 ring-border">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-4 border-b border-border bg-surface shrink-0 pt-2 z-10">
            <a href="./C6-EligibilityResult.html" class="w-10 h-10 flex items-center justify-center text-textPrimary">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <h1 class="text-bodyLarge font-bold">Application Form</h1>
            <div class="w-10 text-caption font-bold text-primary">1/2</div>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-background h-1">
            <div class="bg-primary h-1 w-1/2 rounded-r"></div>
        </div>

        <!-- Form Content -->
        <div class="flex-1 overflow-y-auto p-6 pb-32 no-scrollbar">
            
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex gap-4 items-center mb-6">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-primary shrink-0 shadow-sm border border-blue-100">
                    <i data-lucide="building" class="w-6 h-6"></i>
                </div>
                <div>
                    <h4 class="text-bodyBold font-bold text-primary">SK Finance</h4>
                    <p class="text-caption text-textSecondary mt-1">Please provide accurate details for Final Approval.</p>
                </div>
            </div>
            
            <form id="applicationForm">
                
                <h3 class="text-h2 font-bold mb-4 mt-6">Personal Details</h3>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Full Name (As per PAN)</label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="Ramesh Kumar" value="Ramesh Kumar">
                </div>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">PAN Number</label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body font-mono uppercase focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="ABCDE1234F" value="ABCDE1234F">
                </div>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Aadhaar Number</label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body font-mono focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="XXXX XXXX 1234" value="1234 5678 9012">
                </div>

                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Email Address</label>
                    <input type="email" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="ramesh@example.com" value="ramesh@example.com">
                </div>
                
                <hr class="border-border my-8">
                
                <h3 class="text-h2 font-bold mb-4">Vehicle Details</h3>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Vehicle Make/Model</label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="e.g. Maruti Suzuki Swift" value="Maruti Suzuki Swift VXi">
                </div>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Registration Number (Optional)</label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body font-mono uppercase focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="MH 01 AB 1234">
                </div>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Dealership Code</label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body font-mono focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="DLR-XXXX" value="DLR-001">
                    <p class="text-caption text-success flex items-center gap-1 mt-2"><i data-lucide="check-circle" class="w-3 h-3"></i> Valid Dealer: Wheels Auto</p>
                </div>

            </form>
        </div>

        <!-- Sticky Footer -->
        <div class="absolute bottom-0 w-full bg-surface border-t border-border p-6 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20 pb-10">
            <a href="./C8-DocumentUpload.html" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl transition-colors text-center block text-bodyLarge shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                Continue to Documents <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </a>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
