<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Dealer - Commission Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden sm:rounded-[40px] flex flex-col shadow-2xl ring-1 ring-border pb-[80px]">
        
        <!-- Header / KPI -->
        <header class="bg-primary text-white pt-16 pb-8 px-6 rounded-b-[32px] shadow-md relative z-10 flex flex-col items-center text-center">
            <p class="text-caption text-blue-100 uppercase tracking-widest font-bold mb-2">Available Balance</p>
            <h2 class="text-display font-bold">₹18,750</h2>
            
            <button class="bg-white hover:bg-gray-50 text-primary px-6 py-2 rounded-full text-bodyBold font-bold mt-6 shadow transition-colors w-full max-w-[200px]">
                Request Payout
            </button>
        </header>

        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-4 no-scrollbar">
            
            <h3 class="text-bodyBold font-bold mb-4 mt-2">Recent Transactions</h3>
            
            <div class="flex flex-col gap-4">
                
                <!-- Credit -->
                <div class="flex justify-between items-center border-b border-border pb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-success/10 rounded-full flex items-center justify-center text-success shrink-0">
                            <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="text-bodyBold font-bold">Commission Earned</h4>
                            <p class="text-caption text-textSecondary mt-0.5 font-mono">#APP-84920</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-bodyLarge font-bold text-success">+ ₹6,750</p>
                        <p class="text-[10px] text-textSecondary mt-0.5">14 Aug, 10:30 AM</p>
                    </div>
                </div>

                <!-- Credit -->
                <div class="flex justify-between items-center border-b border-border pb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-success/10 rounded-full flex items-center justify-center text-success shrink-0">
                            <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="text-bodyBold font-bold">Commission Earned</h4>
                            <p class="text-caption text-textSecondary mt-0.5 font-mono">#APP-84880</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-bodyLarge font-bold text-success">+ ₹12,000</p>
                        <p class="text-[10px] text-textSecondary mt-0.5">12 Aug, 04:15 PM</p>
                    </div>
                </div>

                <!-- Debit (Payout) -->
                <div class="flex justify-between items-center border-b border-border pb-4 opacity-75">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-surfaceAlt border border-border rounded-full flex items-center justify-center text-textSecondary shrink-0">
                            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h4 class="text-bodyBold font-bold text-textSecondary">Payout Processed</h4>
                            <p class="text-caption text-textSecondary mt-0.5">To HDFC Bank</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-bodyLarge font-bold text-textPrimary">- ₹45,500</p>
                        <p class="text-[10px] text-textSecondary mt-0.5">05 Aug, 11:00 AM</p>
                    </div>
                </div>

            </div>

        </div>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full h-[80px] bg-surface border-t border-border flex justify-around items-center px-2 z-20 pb-4">
            <a href="./D3-Dashboard.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="./D8-ApplicationTracking.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="files" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Pipeline</span>
            </a>
            <a href="./D10-CommissionWallet.html" class="flex flex-col items-center gap-1 p-2 text-primary">
                <i data-lucide="wallet" class="w-6 h-6"></i>
                <span class="text-[10px] font-semibold">Wallet</span>
            </a>
            <a href="./D12-Profile.html" class="flex flex-col items-center gap-1 p-2 text-textSecondary hover:text-primary transition-colors">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </nav>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
