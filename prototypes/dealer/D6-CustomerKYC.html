<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Dealer - Customer KYC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden sm:rounded-[40px] flex flex-col shadow-2xl ring-1 ring-border">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-4 border-b border-border bg-surface shrink-0 pt-2 z-10">
            <a href="./D8-ApplicationTracking.html" class="w-10 h-10 flex items-center justify-center text-textPrimary">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <h1 class="text-bodyLarge font-bold">Document Upload</h1>
            <div class="w-10"></div> <!-- Spacer -->
        </header>

        <!-- Form Content -->
        <div class="flex-1 overflow-y-auto p-6 pb-32 no-scrollbar">
            
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex gap-3 items-start mb-6">
                <i data-lucide="info" class="w-5 h-5 text-primary shrink-0 mt-0.5"></i>
                <div>
                    <p class="text-body text-primary font-medium">As a dealer, you can upload documents on behalf of the customer to speed up the process.</p>
                </div>
            </div>
            
            <form id="uploadForm" class="flex flex-col gap-4">
                
                <!-- PAN Card -->
                <div class="bg-surface border border-border rounded-xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="text-bodyBold font-bold text-textPrimary flex items-center gap-2">
                                Customer PAN Card <span class="text-danger">*</span>
                            </h4>
                        </div>
                    </div>
                    
                    <!-- Upload Button State -->
                    <button type="button" class="w-full bg-background border border-dashed border-primary/50 hover:bg-primary/5 rounded-lg p-4 flex flex-col items-center justify-center gap-2 transition-colors">
                        <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary mb-1">
                            <i data-lucide="camera" class="w-5 h-5"></i>
                        </div>
                        <span class="text-caption font-bold text-primary">Tap to Capture / Upload</span>
                    </button>
                </div>
                
                <!-- Aadhaar Card -->
                <div class="bg-surface border border-border rounded-xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="text-bodyBold font-bold text-textPrimary flex items-center gap-2">
                                Customer Aadhaar <span class="text-danger">*</span>
                            </h4>
                        </div>
                    </div>
                    
                    <!-- Upload Button State -->
                    <button type="button" class="w-full bg-background border border-dashed border-primary/50 hover:bg-primary/5 rounded-lg p-4 flex flex-col items-center justify-center gap-2 transition-colors">
                        <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary mb-1">
                            <i data-lucide="camera" class="w-5 h-5"></i>
                        </div>
                        <span class="text-caption font-bold text-primary">Tap to Capture / Upload</span>
                    </button>
                </div>
                
                <!-- Vehicle RC -->
                <div class="bg-surface border border-border rounded-xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="text-bodyBold font-bold text-textPrimary flex items-center gap-2">
                                Vehicle RC (If Used Car)
                            </h4>
                        </div>
                    </div>
                    
                    <!-- Upload Button State -->
                    <button type="button" class="w-full bg-background border border-dashed border-border hover:bg-surfaceAlt rounded-lg p-3 flex items-center justify-center gap-2 transition-colors text-textSecondary">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span class="text-caption font-bold">Add Document</span>
                    </button>
                </div>

            </form>
        </div>

        <!-- Sticky Footer -->
        <div class="absolute bottom-0 w-full bg-surface border-t border-border p-6 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20 pb-10 flex gap-3">
            <a href="./D8-ApplicationTracking.html" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl transition-colors text-center block text-bodyLarge shadow-lg shadow-primary/30">
                Upload & Submit
            </a>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
