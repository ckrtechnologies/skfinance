<!DOCTYPE html>
<html lang="en" class="bg-black/90">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Dealer - Vehicle Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Mobile Frame -->
    <div class="max-w-[390px] w-full h-[844px] bg-background text-textPrimary relative overflow-hidden sm:rounded-[40px] flex flex-col shadow-2xl ring-1 ring-border">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-4 border-b border-border bg-surface shrink-0 pt-2 z-10">
            <a href="./D4-NewApplication.html" class="w-10 h-10 flex items-center justify-center text-textPrimary">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <h1 class="text-bodyLarge font-bold">New File (Step 2)</h1>
            <div class="w-10"></div> <!-- Spacer -->
        </header>

        <!-- Progress -->
        <div class="flex items-center justify-between px-8 py-4 bg-surface border-b border-border">
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full bg-success text-white flex items-center justify-center text-caption font-bold mb-1"><i data-lucide="check" class="w-4 h-4"></i></div>
                <span class="text-[10px] font-bold text-success">Customer</span>
            </div>
            <div class="h-0.5 flex-1 bg-success mx-2 mb-4"></div>
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-caption font-bold mb-1">2</div>
                <span class="text-[10px] font-bold text-primary">Vehicle</span>
            </div>
            <div class="h-0.5 flex-1 bg-border mx-2 mb-4"></div>
            <div class="flex flex-col items-center opacity-50">
                <div class="w-8 h-8 rounded-full bg-surfaceAlt border border-border text-textSecondary flex items-center justify-center text-caption font-bold mb-1">3</div>
                <span class="text-[10px] font-bold text-textSecondary">Quote</span>
            </div>
        </div>

        <!-- Form Content -->
        <div class="flex-1 overflow-y-auto p-6 pb-32 no-scrollbar">
            
            <form>
                
                <h3 class="text-h2 font-bold mb-4">Vehicle Details</h3>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Vehicle Category <span class="text-danger">*</span></label>
                    <select class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body focus:outline-none focus:border-primary appearance-none">
                        <option value="">Select Category</option>
                        <option value="used_car" selected>Used Car</option>
                        <option value="new_car">New Car</option>
                        <option value="cv">Commercial Vehicle</option>
                    </select>
                </div>

                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Make / Manufacturer <span class="text-danger">*</span></label>
                    <select class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body focus:outline-none focus:border-primary appearance-none">
                        <option value="">Select Make</option>
                        <option value="maruti" selected>Maruti Suzuki</option>
                        <option value="hyundai">Hyundai</option>
                        <option value="tata">Tata Motors</option>
                        <option value="mahindra">Mahindra</option>
                    </select>
                </div>
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Model & Variant <span class="text-danger">*</span></label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="e.g. Swift VXi" value="Swift VXi">
                </div>

                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Manufacturing Year <span class="text-danger">*</span></label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="year" class="peer sr-only">
                            <div class="w-full text-center py-2 rounded border border-border bg-surface peer-checked:border-primary peer-checked:bg-blue-50 peer-checked:text-primary font-medium text-body transition-colors">2021</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="year" class="peer sr-only" checked>
                            <div class="w-full text-center py-2 rounded border border-border bg-surface peer-checked:border-primary peer-checked:bg-blue-50 peer-checked:text-primary font-medium text-body transition-colors">2022</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="year" class="peer sr-only">
                            <div class="w-full text-center py-2 rounded border border-border bg-surface peer-checked:border-primary peer-checked:bg-blue-50 peer-checked:text-primary font-medium text-body transition-colors">2023</div>
                        </label>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Registration Number (If Used)</label>
                    <input type="text" class="w-full bg-surface border border-border rounded-xl px-4 py-3 text-body font-mono uppercase focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="e.g. MH 01 AB 1234">
                </div>

                <hr class="border-border my-6">

                <h3 class="text-h2 font-bold mb-4">Pricing</h3>

                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Vehicle Valuation / Invoice Price <span class="text-danger">*</span></label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-body font-medium text-textSecondary">₹</span>
                        <input type="number" class="w-full bg-surface border border-border rounded-xl pl-10 pr-4 py-3 text-body font-bold focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" value="650000">
                    </div>
                </div>

            </form>
        </div>

        <!-- Sticky Footer -->
        <div class="absolute bottom-0 w-full bg-surface border-t border-border p-6 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20 pb-10">
            <a href="./D7-QuoteGeneration.html" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl transition-colors text-center block text-bodyLarge shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                Generate Quote <i data-lucide="calculator" class="w-5 h-5"></i>
            </a>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
