<!DOCTYPE html>
<html lang="en" class="bg-surfaceAlt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeja Staff Panel - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-textPrimary relative overflow-hidden">

    <!-- Background Elements -->
    <div class="absolute inset-0 bg-primary/5 z-0"></div>
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary/20 blur-[120px] rounded-full z-0 pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[40%] h-[40%] bg-blue-400/20 blur-[100px] rounded-full z-0 pointer-events-none"></div>

    <div class="w-full max-w-5xl flex rounded-3xl overflow-hidden shadow-2xl bg-surface relative z-10 border border-border">
        
        <!-- Left Side: Branding -->
        <div class="w-1/2 bg-primary p-12 text-white flex flex-col justify-between relative overflow-hidden hidden md:flex">
            <!-- Glass Overlay -->
            <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent z-0"></div>
            
            <div class="relative z-10 flex items-center gap-3">
                <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-primary shadow-lg">
                    <i data-lucide="building-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <h2 class="text-h2 font-bold tracking-tight">Shreeja</h2>
                    <p class="text-caption text-blue-100 tracking-widest uppercase font-bold">Staff Panel</p>
                </div>
            </div>

            <div class="relative z-10 mt-auto">
                <h1 class="text-display font-bold mb-4 leading-tight">Welcome to the<br>Internal Portal</h1>
                <p class="text-bodyLarge text-blue-100 max-w-md leading-relaxed">Access lead management, credit decisions, and disbursement workflows securely.</p>
            </div>
            
            <!-- Decorative Pattern -->
            <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-white opacity-5 rounded-full blur-3xl z-0 pointer-events-none"></div>
            <div class="absolute top-1/4 -right-12 w-48 h-48 border-4 border-white opacity-10 rounded-full z-0 pointer-events-none"></div>
        </div>

        <!-- Right Side: Form -->
        <div class="w-full md:w-1/2 p-12 flex flex-col justify-center">
            
            <div class="md:hidden flex items-center gap-3 mb-8">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i data-lucide="building-2" class="w-5 h-5"></i>
                </div>
                <h2 class="text-h2 font-bold text-primary">Shreeja Staff</h2>
            </div>

            <h3 class="text-h2 font-bold mb-2">Sign In</h3>
            <p class="text-body text-textSecondary mb-8">Enter your internal credentials to access the panel.</p>
            
            <form action="./SP2-Dashboard.html">
                
                <div class="mb-5">
                    <label class="block text-bodyBold text-textPrimary mb-2">Employee Email or ID</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-textSecondary"></i>
                        <input type="text" class="w-full bg-background border border-border rounded-xl pl-12 pr-4 py-3.5 text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="e.g. EMP-992 or email">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-bodyBold text-textPrimary mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-textSecondary"></i>
                        <input type="password" class="w-full bg-background border border-border rounded-xl pl-12 pr-4 py-3.5 text-body focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" value="password123">
                    </div>
                    <div class="flex justify-between items-center mt-3">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="w-4 h-4 rounded border-border text-primary focus:ring-primary">
                            <span class="text-caption text-textSecondary font-medium">Remember me</span>
                        </label>
                        <a href="#" class="text-caption font-bold text-primary hover:underline">Forgot password?</a>
                    </div>
                </div>

                <a href="./SP2-Dashboard.html" class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 rounded-xl transition-colors text-center block text-bodyLarge shadow-lg shadow-primary/20">
                    Access Portal
                </a>
                
            </form>
            
            <p class="text-center text-caption text-textSecondary mt-8">Secure Internal Environment • v3.0</p>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
